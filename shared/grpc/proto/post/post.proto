syntax = "proto3";

package post;

option go_package = "cosmix/shared/grpc/gen/go/post";

service PostService {
  rpc CreatePost(CreatePostRequest)
      returns (PostResponse);

  rpc GetPost(GetPostRequest)
      returns (PostResponse);

  rpc GetFeed(GetFeedRequest)
      returns (PostListResponse);

  rpc GetUserPosts(GetUserPostsRequest)
      returns (PostListResponse);

  rpc UpdatePost(UpdatePostRequest)
      returns (PostResponse);

  rpc DeletePost(DeletePostRequest)
      returns (MessageResponse);

  rpc LikePost(LikePostRequest)
      returns (MessageResponse);

  rpc UnlikePost(UnlikePostRequest)
      returns (MessageResponse);

  rpc CreateComment(CreateCommentRequest)
      returns (CommentResponse);

  rpc GetComments(GetCommentsRequest)
      returns (CommentListResponse);

  rpc GetReplies(GetRepliesRequest)
      returns (CommentListResponse);

  rpc UpdateComment(UpdateCommentRequest)
      returns (CommentResponse);

  rpc DeleteComment(DeleteCommentRequest)
      returns (MessageResponse);

  rpc LikeComment(LikeCommentRequest)
      returns (MessageResponse);

  rpc UnlikeComment(UnlikeCommentRequest)
      returns (MessageResponse);
}

message MessageResponse {
  string message = 1;
}

message Pagination {
  int32 total_count = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total_pages = 4;
}

message MediaItem {
  string public_id = 1;
  string url = 2;
  string type = 3;
  int32 duration = 4;
}

message Media {
  string id = 1;
  string post_id = 2;
  string public_id = 3;
  string url = 4;
  string type = 5;
  int32 duration = 6;
  string created_at = 7;
  string updated_at = 8;
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string display_name = 4;
  string created_at = 5;
  string updated_at = 6;
  string avatar_url = 7;
}

message Post {
  string id = 1;
  string content = 2;
  int32 likes_count = 3;
  int32 comments_count = 4;
  string created_at = 5;
  string updated_at = 6;
  User user = 7;
  repeated Media media = 8;
  int32 shares_count = 9;
  bool is_liked = 10;
  bool is_owner = 11;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  string content = 4;
  string created_at = 5;
  string updated_at = 6;
  User user = 7;
  int32 likes_count = 8;
  int32 replies_count = 9;
  bool is_liked = 10;
  string parent_comment_id = 11;
  bool is_owner = 12;
}

message PostResponse {
  Post post = 1;
}

message PostListResponse {
  repeated Post posts = 1;
  Pagination pagination = 2;
}

message CommentResponse {
  Comment comment = 1;
}

message CommentListResponse {
  repeated Comment comments = 1;
  Pagination pagination = 2;
}

message GetPostRequest {
  string post_id = 1;
}

message GetFeedRequest {
  int32 page = 1;
  int32 limit = 2;
  string user_id = 3;
}

message GetUserPostsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string viewer_id = 4;
}

message CreatePostRequest {
  string author_id = 1;
  string content = 2;
  repeated MediaItem media = 3;
}

message UpdatePostRequest {
  string post_id = 1;
  string author_id = 2;
  string content = 3;
  repeated MediaItem media = 4;
}

message DeletePostRequest {
  string post_id = 1;
  string author_id = 2;
}

message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message UnlikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message CreateCommentRequest {
  string post_id = 1;
  string author_id = 2;
  string content = 3;
  string parent_comment_id = 4;
}

message GetCommentsRequest {
  string post_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string user_id = 4;
}

message GetRepliesRequest {
  string comment_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string user_id = 4;
}

message LikeCommentRequest {
  string comment_id = 1;
  string user_id = 2;
}

message UnlikeCommentRequest {
  string comment_id = 1;
  string user_id = 2;
}

message UpdateCommentRequest {
  string comment_id = 1;
  string author_id = 2;
  string content = 3;
}

message DeleteCommentRequest {
  string comment_id = 1;
  string author_id = 2;
}